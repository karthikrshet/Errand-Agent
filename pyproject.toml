[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat-based home-services errand agent with code-enforced approvals, idempotent booking and evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "tiktoken>=0.7",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]

[project.scripts]
errand = "errand.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["errand"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["evals/cassettes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = [
    "PLR0913",  # explicit dependency injection makes long signatures normal here
    "PLR2004",  # magic values in tests are fine; production numbers live in config.py
    "N818",     # error names (ToolTimeout, SlotTaken, ...) are fixed by the brief
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"evals/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["errand"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 60
markers = [
    "slow: distribution / long-running tests",
]
